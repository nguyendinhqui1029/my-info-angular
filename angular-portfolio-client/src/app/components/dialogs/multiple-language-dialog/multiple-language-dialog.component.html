<div class="multiple-language-dialog-wrapper">
  @for(item of languages().data?.data; track item) {
  <div class="language-item">
    <p-checkbox [disabled]="initializeLanguage.includes(item.code)" [name]="item.name" [(ngModel)]="selectedLanguage" [value]="item.code" [inputId]="item.code"[ngModelOptions]="{standalone: true}"/>
    <div class="content-wrapper">
      <img [src]="item.flag" [alt]="item.description" class="flag" />
      <label [for]="item.code">
        {{item.name}}
      </label>
    </div>
  </div>
  }
</div>
<div class="button-wrapper">
  <p-button [label]="'button_ok' | translate" [attr.aria-label]="'button_ok' | translate" (click)="handleOkClick()" />
</div>
